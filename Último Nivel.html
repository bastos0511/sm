<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Último Nivel</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<style>
/* Layout: one 16:9 pixel stage (a side-scrolling walk at dusk), HUD above, touch pad below. Dark by choice: the game is a night scene. */
:root {
  --bg: #14101f;
  --panel: #231a36;
  --ink: #f4e9d8;
  --muted: #b9a9c8;
  --amber: #ffb84d;
  --rose: #ff7a90;
  --line: #3a2d52;
  --display: "Press Start 2P", ui-monospace, "Courier New", monospace;
  --body: "VT323", ui-monospace, "Courier New", monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--body);
  font-size: 20px;
  padding-block: 20px 28px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.shell { max-width: 960px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
.hud {
  display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px 16px;
  font-family: var(--display); font-size: 10px; letter-spacing: 0.08em; color: var(--amber);
}
.hud span:last-child { color: var(--rose); font-variant-numeric: tabular-nums; }
.stage {
  position: relative; aspect-ratio: 16 / 9; width: 100%; max-width: 100%;
  border: 4px solid var(--line); box-shadow: 6px 6px 0 #000; background: #000; overflow: hidden;
}
canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; }
.screen {
  position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 14px; padding: 12px; text-align: center; background: rgba(14, 10, 24, 0.6);
}
.screen h1, .screen h2 {
  margin: 0; font-family: var(--display); font-weight: 400; color: var(--amber);
  font-size: clamp(16px, 4.6vw, 34px); line-height: 1.4; text-wrap: balance;
  text-shadow: 3px 3px 0 #000;
}
.screen p { margin: 0; font-size: clamp(18px, 3vw, 26px); color: var(--ink); max-width: 30em; text-wrap: balance; }
.btn {
  font-family: var(--display); font-size: 10px; letter-spacing: 0.06em; color: #1a1226; background: var(--amber);
  border: 0; padding: 12px 16px; cursor: pointer; box-shadow: 3px 3px 0 #000;
}
.btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 #000; }
.btn:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
.dialog {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  padding: 10px; background: rgba(10, 8, 18, 0.78);
}
.box {
  width: 100%; max-height: 100%; overflow: auto; background: var(--panel);
  border: 3px solid var(--amber); box-shadow: 4px 4px 0 #000; padding: 14px 16px;
  display: flex; flex-direction: column; gap: 10px; cursor: pointer;
}
.box h3 { margin: 0; font-family: var(--display); font-weight: 400; font-size: clamp(8px, 1.6vw, 12px); line-height: 1.5; color: var(--amber); }
.box p { margin: 0; font-size: clamp(18px, 2.8vw, 27px); line-height: 1.25; white-space: pre-line; min-height: 2.5em; }
.box .btn { align-self: flex-end; }
.toast {
  position: absolute; top: 8px; left: 50%; transform: translateX(-50%); max-width: 92%;
  background: #000; color: var(--ink); border: 2px solid var(--rose); padding: 4px 10px;
  font-size: clamp(16px, 2.4vw, 22px); text-align: center;
}
.pad { display: flex; gap: 10px; }
.pad button {
  flex: 1; min-height: 56px; background: var(--panel); color: var(--ink); border: 3px solid var(--line);
  box-shadow: 3px 3px 0 #000; font-family: var(--display); font-size: 10px; touch-action: none;
  user-select: none; -webkit-user-select: none; cursor: pointer;
}
.pad button.jump { flex: 1.6; color: var(--amber); border-color: var(--amber); }
.pad button:active { background: var(--line); }
.pad button:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
.help { margin: 0; font-size: 19px; color: var(--muted); }
@media (hover: hover) and (pointer: fine) { .pad { display: none; } }
</style>

<main class="shell">
  <header class="hud">
    <span>ÚLTIMO NIVEL</span>
    <span id="hudCount">RECUERDOS 0/5</span>
  </header>

  <div class="stage">
    <canvas id="c" width="320" height="180" aria-label="Escena del juego: un personaje camina de noche entre farolas"></canvas>
    <div id="toast" class="toast" hidden></div>

    <div id="intro" class="screen">
      <h1>ÚLTIMO NIVEL</h1>
      <p>Un juego para <span id="para">ti</span>. Camina, salta y recoge cada recuerdo.</p>
      <button id="startBtn" class="btn" type="button">EMPEZAR</button>
    </div>

    <div id="dialog" class="dialog" role="dialog" aria-live="polite" hidden>
      <div id="box" class="box">
        <h3 id="dlgTitle"></h3>
        <p id="dlgText"></p>
        <button id="dlgNext" class="btn" type="button">SIGUIENTE ▼</button>
      </div>
    </div>

    <div id="outro" class="screen" hidden>
      <h2>FIN</h2>
      <p>Gracias por jugar hasta el final.</p>
      <button id="againBtn" class="btn" type="button">VOLVER A JUGAR</button>
    </div>
  </div>

  <div class="pad" aria-label="Controles táctiles">
    <button id="btnLeft" type="button" aria-label="Izquierda">◀ IZQ</button>
    <button id="btnRight" type="button" aria-label="Derecha">DER ▶</button>
    <button id="btnJump" class="jump" type="button" aria-label="Saltar">SALTAR</button>
  </div>
  <p class="help">Flechas o A / D para caminar. Espacio o flecha arriba para saltar.</p>
</main>

<script>
/* ====== TEXTOS: cambia aquí lo que dice el juego ====== */
const CONFIG = {
  para: "ti",
  de: "tu niño",
  memories: [
    { title: "NIVEL 1 · CÓMO EMPEZÓ", text: "Nos conocimos en colegio, Todavía me acuerdo del cuando me metieron a su super grupo. No sabía que ese momento iba a importar tanto." },
    { title: "NIVEL 2 · LO QUE REÍMOS", text: "Hubo días en los que no podíamos parar de burlarnos entre nosotros. Esa risa fue de lo mejor que tuvimos." },
    { title: "NIVEL 3 · LO QUE VIVÍ CONTIGO", text: "me acuerdo nuestra primera salida solos, fuimos juntos a comer tacos, nuestra primera historiaaa. Fue uno de esos días que quiero guardar completos." },
    { title: "NIVEL 4 · LO QUE APRENDÍ", text: "También hubo momentos difíciles muchos errores mios de ellos aprendí a escuchar mejor y a decir las cosas a tiempo en vez de callarme y guardarme todo." },
    { title: "NIVEL 5 · LO QUE ME LLEVO", text: "Tu me hiciste mejor persona, y eso no se borra, me ayudaste a mejorar y cambiar cuando estabamos juntos y cuando no." }
  ],
  final: {
    title: "NIVEL FINAL",
    text: "Gracias por cada nivel que jugamos juntos. Lo bonito fue real y lo voy a recordar con cariño.\n\nsolo te queria dedicar algo y pues como esto es lo que soy ahora porque no utilizarlo este no sera el final de la partida amor mio hay que sacarle secuela a nuestro amor y yo me voy a encargar de eso te lo aseguro."
  }
};
/* ====== fin de textos ====== */

const $ = (id) => document.getElementById(id);
const cv = $("c"), ctx = cv.getContext("2d");
ctx.imageSmoothingEnabled = false;
const VW = 320, VH = 180, GROUND = 144, WORLD = 1560;
const reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

$("para").textContent = CONFIG.para;

const STAR_X = [260, 520, 780, 1040, 1300];
const STAR_Y = [126, 104, 118, 100, 112];
const stars = CONFIG.memories.map((m, i) => ({ x: STAR_X[i], y: STAR_Y[i], got: false, title: m.title, text: m.text }));
const door = { x: 1480 };
const player = { x: 40, y: GROUND, vx: 0, vy: 0, on: true, face: 1, t: 0 };
let state = "intro", time = 0, cam = 0, dispP = 0, collected = 0;

/* ---------- color helpers ---------- */
function rgb(h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }
function mix(a, b, t) {
  const A = rgb(a), B = rgb(b);
  return "rgb(" + A.map((v, i) => Math.round(v + (B[i] - v) * t)).join(",") + ")";
}
function R(x, y, w, h, c) { ctx.fillStyle = c; ctx.fillRect(Math.round(x), Math.round(y), w, h); }
function disc(cx, cy, r, c) {
  ctx.fillStyle = c;
  for (let dy = -r; dy <= r; dy++) {
    const w = Math.floor(Math.sqrt(r * r - dy * dy));
    ctx.fillRect(Math.round(cx - w), Math.round(cy + dy), w * 2 + 1, 1);
  }
}
function sprite(rows, x, y, c) {
  ctx.fillStyle = c;
  for (let r = 0; r < rows.length; r++)
    for (let k = 0; k < rows[r].length; k++)
      if (rows[r][k] === "#") ctx.fillRect(Math.round(x) + k, Math.round(y) + r, 1, 1);
}

/* ---------- scenery data ---------- */
const skyStars = Array.from({ length: 42 }, (_, i) => ({ x: (i * 97) % VW, y: 4 + ((i * 53) % 80), s: i % 5 === 0 ? 2 : 1 }));
const buildings = Array.from({ length: 130 }, (_, i) => {
  const w = 20 + ((i * 7) % 14), h = 34 + ((i * 29) % 40);
  const wins = [];
  for (let cx = 0; cx < Math.floor((w - 4) / 6); cx++)
    for (let cy = 0; cy < Math.floor((h - 6) / 9); cy++) wins.push({ x: 3 + cx * 6, y: 4 + cy * 9, lit: (i * 3 + cx * 5 + cy * 7) % 3 !== 0 });
  return { w, h, wins };
});
const STAR_SPRITE = ["...#...", "...#...", "#######", ".#####.", "..###..", ".##.##.", ".#...#."];

/* ---------- drawing ---------- */
function draw() {
  const p = dispP;
  // sky in bands
  const topC = [mix("#4a3560", "#0c0f24", p)], botC = [mix("#f0996b", "#2a3358", p)];
  const tA = rgb("#4a3560"), tB = rgb("#0c0f24"), bA = rgb("#f0996b"), bB = rgb("#2a3358");
  const top = tA.map((v, i) => v + (tB[i] - v) * p), bot = bA.map((v, i) => v + (bB[i] - v) * p);
  const bands = 10;
  for (let i = 0; i < bands; i++) {
    const t = i / (bands - 1);
    ctx.fillStyle = "rgb(" + top.map((v, k) => Math.round(v + (bot[k] - v) * t)).join(",") + ")";
    ctx.fillRect(0, Math.floor((i * GROUND) / bands), VW, Math.ceil(GROUND / bands) + 1);
  }
  // sky stars
  for (const s of skyStars) {
    const tw = 0.6 + 0.4 * Math.sin(time * 2 + s.x);
    ctx.globalAlpha = Math.max(0, (p - 0.15) * 1.2) * tw;
    R(s.x, s.y, s.s, s.s, "#f4e9d8");
  }
  ctx.globalAlpha = 1;
  // sun sets, moon rises
  ctx.globalAlpha = 1 - p; disc(80, 92 + p * 80, 12, "#ffd28a");
  ctx.globalAlpha = p; disc(244, 34, 9, "#f4e9d8"); disc(248, 31, 8, mix("#4a3560", "#0c0f24", p));
  ctx.globalAlpha = 1;
  // far hills
  ctx.fillStyle = mix("#6b3f5c", "#141a35", p);
  for (let x = 0; x < VW; x += 2) {
    const wx = x + cam * 0.25;
    const h = 34 + 14 * Math.sin(wx / 38) + 8 * Math.sin(wx / 17);
    ctx.fillRect(x, Math.round(GROUND - h), 2, Math.round(h));
  }
  // city
  const bc = mix("#4a2c52", "#0a0d1f", p);
  let bx = -cam * 0.5;
  for (const b of buildings) {
    if (bx > VW) break;
    if (bx + b.w > 0) {
      R(bx, GROUND - b.h, b.w, b.h, bc);
      ctx.globalAlpha = Math.min(1, p * 1.3);
      for (const w of b.wins) if (w.lit) R(bx + w.x, GROUND - b.h + w.y, 3, 4, "#ffcf7a");
      ctx.globalAlpha = 1;
    }
    bx += b.w + 6;
  }
  // ground
  R(0, GROUND, VW, VH - GROUND, mix("#2a1d33", "#0b0d1c", p));
  R(0, GROUND, VW, 2, mix("#6b4a62", "#2b3258", p));
  for (let x = -(cam % 24); x < VW; x += 24) R(x, GROUND + 12, 10, 2, mix("#1c1226", "#070914", p));
  for (let x = -(cam % 40) + 6; x < VW; x += 40) R(x, GROUND + 26, 14, 2, mix("#1c1226", "#070914", p));
  // lamps
  for (let k = 0; k < 9; k++) {
    const sx = 120 + k * 200 - cam;
    if (sx < -20 || sx > VW + 20) continue;
    R(sx, GROUND - 34, 2, 34, mix("#3b2a40", "#161a30", p));
    R(sx - 3, GROUND - 38, 8, 4, mix("#3b2a40", "#161a30", p));
    const glow = Math.max(0, p - 0.1);
    ctx.globalAlpha = glow * 0.22; disc(sx + 1, GROUND - 34, 16, "#ffcf7a");
    ctx.globalAlpha = glow; R(sx - 1, GROUND - 34, 4, 2, "#ffe3a6");
    ctx.globalAlpha = 1;
  }
  // door
  const dx = door.x - cam, open = collected === stars.length;
  if (dx > -30 && dx < VW + 30) {
    R(dx - 12, GROUND - 36, 24, 36, mix("#5a3a4a", "#2a2440", p));
    if (open) {
      ctx.globalAlpha = 0.25 + 0.1 * Math.sin(time * 3); disc(dx, GROUND - 18, 22, "#ffb84d");
      ctx.globalAlpha = 1;
      R(dx - 9, GROUND - 33, 18, 33, "#ffb84d");
      R(dx - 9, GROUND - 33, 18, 4, "#ffe3a6");
    } else {
      R(dx - 9, GROUND - 33, 18, 33, "#1a1226");
      R(dx - 2, GROUND - 18, 4, 5, "#7a6a8a");
    }
  }
  // memory stars
  stars.forEach((s, i) => {
    if (s.got) return;
    const sx = s.x - cam, sy = s.y + Math.sin(time * 3 + i) * 2;
    if (sx < -20 || sx > VW + 20) return;
    ctx.globalAlpha = 0.22; disc(sx, sy, 11, "#ffb84d");
    ctx.globalAlpha = 1;
    sprite(STAR_SPRITE, sx - 3, sy - 4, "#ffb84d");
    R(sx - 1, sy - 1, 2, 2, "#fff3d0");
  });
  // player
  const px = player.x - cam, y = player.y, moving = Math.abs(player.vx) > 1 && player.on;
  ctx.globalAlpha = 0.3; R(px - 5, GROUND - 1, 10, 2, "#000"); ctx.globalAlpha = 1;
  const leg = moving ? Math.floor(player.t * 10) % 2 : 0;
  R(px - 3, y - 3, 3, 3 - (leg ? 1 : 0), "#2a1d33");
  R(px, y - 3, 3, 3 - (leg ? 0 : 1), "#2a1d33");
  R(px - 4, y - 9, 8, 6, "#ff7a90");
  R(px - 4, y - 10, 8, 2, "#ffb84d");
  const tailX = player.face > 0 ? px - 8 : px + 4;
  R(tailX, y - 10 + Math.round(Math.sin(time * 9)), 4, 2, "#ffb84d");
  R(px - 4, y - 16, 8, 7, "#f2c9a0");
  R(px - 4, y - 17, 8, 3, "#3a2418");
  R(px + (player.face > 0 ? 1 : -2), y - 14, 1, 2, "#1a1226");
}

/* ---------- state & input ---------- */
const keys = { left: false, right: false, jump: false };
const touch = { left: false, right: false, jump: false };
const KEYMAP = { ArrowLeft: "left", KeyA: "left", ArrowRight: "right", KeyD: "right", ArrowUp: "jump", KeyW: "jump", Space: "jump" };

window.addEventListener("keydown", (e) => {
  const k = KEYMAP[e.code];
  if (!k || state !== "play") return;
  if (e.target && e.target.tagName === "BUTTON" && e.code === "Space") return;
  e.preventDefault();
  keys[k] = true;
});
window.addEventListener("keyup", (e) => { const k = KEYMAP[e.code]; if (k) keys[k] = false; });
window.addEventListener("blur", () => { keys.left = keys.right = keys.jump = false; });

function hold(el, name) {
  el.addEventListener("pointerdown", (e) => { e.preventDefault(); touch[name] = true; if (el.setPointerCapture) el.setPointerCapture(e.pointerId); });
  ["pointerup", "pointercancel", "lostpointercapture"].forEach((ev) => el.addEventListener(ev, () => { touch[name] = false; }));
  el.addEventListener("contextmenu", (e) => e.preventDefault());
}
hold($("btnLeft"), "left"); hold($("btnRight"), "right"); hold($("btnJump"), "jump");

function updateHud() { $("hudCount").textContent = "RECUERDOS " + collected + "/" + stars.length; }

let toastTimer = null;
function toast(msg) {
  const t = $("toast");
  t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.hidden = true; }, 2200);
}

/* ---------- dialog with typewriter ---------- */
let typeTimer = null, typed = "", typedN = 0, typeDone = true, onDialogClose = null;
function openDialog(title, text, last, onClose) {
  state = "dialog";
  keys.left = keys.right = keys.jump = false;
  onDialogClose = onClose;
  $("dlgTitle").textContent = title;
  $("dlgNext").textContent = last ? "TERMINAR ▼" : "SEGUIR ▼";
  $("dialog").hidden = false;
  typed = text; typedN = 0; typeDone = false;
  $("dlgText").textContent = "";
  clearTimeout(typeTimer);
  const step = () => {
    typedN++;
    $("dlgText").textContent = typed.slice(0, typedN);
    if (typedN < typed.length) typeTimer = setTimeout(step, 24); else typeDone = true;
  };
  if (reduceMotion) { $("dlgText").textContent = typed; typeDone = true; } else step();
  $("dlgNext").focus();
}
$("box").addEventListener("click", () => {
  if (!typeDone) { clearTimeout(typeTimer); $("dlgText").textContent = typed; typeDone = true; return; }
  $("dialog").hidden = true;
  if (document.activeElement) document.activeElement.blur();
  const cb = onDialogClose; onDialogClose = null;
  if (cb) cb();
});

/* ---------- game flow ---------- */
function collect(s) {
  s.got = true; collected++; updateHud();
  const last = collected === stars.length;
  openDialog(s.title, s.text, false, () => {
    state = "play";
    if (last) toast("La puerta del final está abierta");
  });
}
function finish() {
  openDialog(CONFIG.final.title, CONFIG.final.text + "\n\n— " + CONFIG.de, true, () => {
    state = "end"; $("outro").hidden = false; $("againBtn").focus();
  });
}
function resetGame() {
  stars.forEach((s) => { s.got = false; });
  collected = 0; dispP = 0; cam = 0; updateHud();
  Object.assign(player, { x: 40, y: GROUND, vx: 0, vy: 0, on: true, face: 1, t: 0 });
  $("outro").hidden = true; state = "play";
  if (document.activeElement) document.activeElement.blur();
}
$("startBtn").addEventListener("click", () => { $("intro").hidden = true; state = "play"; $("startBtn").blur(); });
$("againBtn").addEventListener("click", resetGame);

function update(dt) {
  dispP += (collected / stars.length - dispP) * Math.min(1, dt * 2);
  if (state !== "play") { player.vx = 0; return; }
  const L = keys.left || touch.left, Rt = keys.right || touch.right, J = keys.jump || touch.jump;
  const dir = (Rt ? 1 : 0) - (L ? 1 : 0);
  player.vx = dir * 85;
  if (dir) player.face = dir;
  player.x += player.vx * dt;
  const open = collected === stars.length;
  const maxX = open ? WORLD - 8 : door.x - 20;
  player.x = Math.max(8, Math.min(maxX, player.x));
  if (dir && player.on) player.t += dt;
  if (J && player.on) { player.vy = -235; player.on = false; }
  player.vy += 720 * dt;
  player.y += player.vy * dt;
  if (player.y >= GROUND) { player.y = GROUND; player.vy = 0; player.on = true; }
  const cx = player.x, cy = player.y - 8;
  for (const s of stars) {
    if (!s.got && Math.abs(cx - s.x) < 12 && Math.abs(cy - s.y) < 14) { collect(s); return; }
  }
  if (Math.abs(player.x - door.x) < 24) {
    if (open) finish(); else toast("Aún faltan recuerdos por recoger");
  }
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now; time += dt;
  update(dt);
  const target = Math.max(0, Math.min(WORLD - VW, player.x - VW / 2));
  cam += (target - cam) * Math.min(1, dt * 6);
  draw();
  requestAnimationFrame(frame);
}
updateHud();
requestAnimationFrame(frame);
</script>

</body></html>
